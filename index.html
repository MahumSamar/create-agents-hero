<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Create your own agents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08090a;
    --text: #f7f8f8;
    --muted: #8a8f98;
    --btn-bg: #e6e6e6;
    --btn-text: #08090a;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
  }

  body {
    font-family: "Inter", "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  .agents {
    position: relative;
    height: 100vh;
    height: 100svh;
    min-height: 480px;
    overflow: hidden;
    background: var(--bg);
    isolation: isolate;
  }

  /* ---------- Background video ---------- */
  .agents__media {
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;
  }

  .agents__video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 50%;
    opacity: 0;
    transition: opacity 0.9s ease;
    /* lifts the video's black to the page black so no seam is visible */
    mix-blend-mode: lighten;
  }

  .agents__video.is-visible { opacity: 1; }

  /* ---------- Content ---------- */
  .agents__content {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: clamp(48px, 11.5vh, 128px) 24px 0;
  }

  .agents__title {
    margin: 0;
    font-size: 32px;
    line-height: 1.125;
    font-weight: 500;
    letter-spacing: -0.022em;
    color: var(--text);
  }

  .agents__text {
    margin: 12px 0 0;
    font-size: 16px;
    line-height: 1.3;
    font-weight: 400;
    letter-spacing: -0.011em;
    color: var(--muted);
  }

  .agents__button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 32px;
    margin-top: 24px;
    padding: 0 12px;
    border: 1px solid var(--btn-bg);
    border-radius: 8px;
    background: var(--btn-bg);
    color: var(--btn-text);
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: -0.005em;
    line-height: 1;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.2), 0 4px 12px rgba(0, 0, 0, 0.35);
    transition: background-color 0.16s ease, border-color 0.16s ease, transform 0.16s ease;
  }

  .agents__button:hover { background: #fff; border-color: #fff; }
  .agents__button:active { transform: scale(0.98); }
  .agents__button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  /* ---------- Tablet ---------- */
  @media (max-width: 900px) {
    .agents__video {
      inset: auto;
      left: 50%;
      top: 62%;
      width: 150vw;
      height: auto;
      aspect-ratio: 16 / 9;
      transform: translate(-50%, -50%);
      object-fit: cover;
    }
  }

  /* ---------- Mobile ---------- */
  @media (max-width: 600px) {
    .agents__content { padding: clamp(56px, 10vh, 96px) 20px 0; }
    .agents__title { font-size: 28px; }
    .agents__text { font-size: 15px; line-height: 1.4; }
    .agents__text br { display: none; }
    .agents__text { max-width: 320px; }

    .agents__video {
      top: 58%;
      width: 190vw;
    }
  }

  @media (max-width: 380px) {
    .agents__title { font-size: 26px; }
  }

  /* short landscape phones */
  @media (max-height: 520px) and (orientation: landscape) {
    .agents__content { padding-top: 32px; }
    .agents__title { font-size: 26px; }
    .agents__text { margin-top: 8px; font-size: 14px; }
    .agents__button { margin-top: 16px; }
  }
</style>
</head>
<body>

<section class="agents" aria-labelledby="agents-title">
  <div class="agents__media" aria-hidden="true">
    <video
      class="agents__video"
      src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261010_053237_27d32c91-4d3a-45e4-a2ca-6de97e708473.mp4"
      data-poster="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20261010_053143_57af9fb6-2730-4cbf-be50-0a0cd7e7ec6a.png"
      muted
      playsinline
      autoplay
      preload="auto"
      disablepictureinpicture
    ></video>
  </div>

  <div class="agents__content">
    <h2 class="agents__title" id="agents-title">Create your own agents</h2>
    <p class="agents__text">
      Build your own AI teammates with the Linear API.<br>
      Keep them private or share with the Linear community.
    </p>
    <a class="agents__button" href="#">Start building</a>
  </div>
</section>

<script>
  (function () {
    var video = document.querySelector('.agents__video');
    if (!video) return;

    var HOLD_MS = 2200;  // rest on the final pose
    var FADE_MS = 900;   // matches the CSS opacity transition
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Reduced motion: show the final composition as a still.
    if (reduced) {
      video.removeAttribute('autoplay');
      video.pause();
      video.poster = video.dataset.poster;
      video.classList.add('is-visible');
      return;
    }

    function start() {
      video.currentTime = 0;
      var p = video.play();
      if (p && p.catch) p.catch(function () {});
      video.classList.add('is-visible');
    }

    // Loop: play in -> hold the final frame -> fade to black -> replay.
    video.addEventListener('ended', function () {
      setTimeout(function () {
        video.classList.remove('is-visible');
        setTimeout(start, FADE_MS);
      }, HOLD_MS);
    });

    if (video.readyState >= 2) start();
    else video.addEventListener('loadeddata', start, { once: true });

    // Don't burn cycles while the section is off screen.
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { if (video.paused && !video.ended) video.play().catch(function () {}); }
          else video.pause();
        });
      }, { threshold: 0.05 }).observe(video);
    }
  })();
</script>

</body>
</html>
